<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過三關連線版</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font - Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* 徹底封鎖滾動條 */
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    
    /* 遊戲主容器：固定基準尺寸，置中縮放 */
    #game-container {
      width: 380px;
      height: 620px;
      flex-shrink: 0;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      box-sizing: border-box;
    }

    /* 強制棋盤九宮格尺寸固定，絕不因為文字出現而擠壓或拉伸 */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    /* 單一棋格固定與防晃動 */
    .cell-btn {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      line-height: 1;
      user-select: none;
    }

    /* Glowing Effects for X and O */
    .glow-x {
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      line-height: 1;
    }
    .glow-o {
      color: #f43f5e;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      line-height: 1;
    }
    .cell-hover:hover {
      background-color: rgba(51, 65, 85, 0.5);
    }
    
    /* Custom Modal Transitions */
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="select-none">

  <!-- Main Container (Autoscaled Container) -->
  <div id="game-container">
    
    <!-- Header Title -->
    <header class="text-center w-full">
      <h1 class="text-3xl font-extrabold font-outfit tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-rose-500">
        過三關連線版
      </h1>
      <p class="text-[10px] text-slate-400 mt-0.5 tracking-widest uppercase">Real-Time Multiplayer</p>
    </header>

    <!-- Mode Selector & Game Controls Header -->
    <div class="w-full flex justify-between items-center bg-slate-800/60 p-2 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
      <div id="mode-badge" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-users"></i>
        <span id="mode-text">本地單機</span>
      </div>
      
      <button onclick="openModeMenu()" class="text-xs px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition-all font-semibold flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-gamepad"></i> 切換模式
      </button>
    </div>

    <!-- Status Banner -->
    <div id="status-card" class="w-full bg-slate-800/80 rounded-2xl p-3 border border-slate-700 flex justify-between items-center shadow-xl">
      <div class="flex items-center gap-3">
        <div id="turn-indicator" class="w-9 h-9 rounded-xl bg-slate-700/50 border border-slate-600 flex items-center justify-center text-xl font-black font-outfit flex-shrink-0">
          <span class="glow-x">X</span>
        </div>
        <div>
          <div id="status-message" class="text-xs font-semibold text-slate-200">輪到 X 下棋</div>
          <div id="role-subtitle" class="text-[10px] text-slate-400">雙人輪流落子</div>
        </div>
      </div>

      <!-- Online Room Code & Share Info (Hidden by default) -->
      <div id="room-info" class="hidden flex flex-col items-end">
        <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">房間代碼</span>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span id="display-room-id" class="font-mono text-sm font-bold text-sky-400 bg-slate-900/80 px-2 py-0.5 rounded-md border border-slate-700">------</span>
          <button onclick="copyInviteLink()" title="複製邀請連結" class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Tic-Tac-Toe Game Board (Fixed Grid strictly locking row/col proportions) -->
    <div class="w-full aspect-square bg-slate-800/40 border border-slate-700/80 rounded-3xl p-3 grid-board shadow-2xl relative">
      <button onclick="handleCellClick(0)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="0"></button>
      <button onclick="handleCellClick(1)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="1"></button>
      <button onclick="handleCellClick(2)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="2"></button>
      <button onclick="handleCellClick(3)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="3"></button>
      <button onclick="handleCellClick(4)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="4"></button>
      <button onclick="handleCellClick(5)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="5"></button>
      <button onclick="handleCellClick(6)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="6"></button>
      <button onclick="handleCellClick(7)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="7"></button>
      <button onclick="handleCellClick(8)" class="cell cell-btn cell-hover rounded-2xl bg-slate-800/80 border border-slate-700/50 font-extrabold font-outfit text-4xl transition-all duration-150 active:scale-95" data-index="8"></button>
    </div>

    <!-- Bottom Actions -->
    <div class="w-full flex gap-3">
      <button onclick="resetGame()" class="flex-1 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold text-xs text-slate-200 transition-all flex items-center justify-center gap-2 active:scale-95 shadow-lg">
        <i class="fa-solid fa-rotate-right"></i> 重新開始
      </button>
      <button id="leave-room-btn" onclick="leaveOnlineRoom()" class="hidden py-3 px-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 font-semibold text-xs text-rose-400 hover:bg-rose-500/20 transition-all flex items-center justify-center gap-2 active:scale-95">
        <i class="fa-solid fa-door-open"></i> 離開房間
      </button>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold transition-all duration-300 opacity-0 pointer-events-none translate-y-4 flex items-center gap-2 z-50">
    <i class="fa-solid fa-circle-info text-sky-400"></i>
    <span id="toast-text">通知訊息</span>
  </div>

  <!-- Modal 1: Mode Selection Menu -->
  <div id="mode-modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-40">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <div class="text-center">
        <h3 class="text-xl font-bold font-outfit text-slate-100">選擇遊戲模式</h3>
        <p class="text-xs text-slate-400 mt-1">選擇你喜歡的棋局對戰方式</p>
      </div>

      <div class="space-y-3 pt-2">
        <button onclick="setMode('pass-and-play')" class="w-full p-4 rounded-2xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/50 flex items-center gap-4 transition text-left group">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-user-group"></i>
          </div>
          <div>
            <div class="font-bold text-sm text-slate-200">同屏雙人對戰</div>
            <div class="text-xs text-slate-400">同一台手機/電腦交替落子</div>
          </div>
        </button>

        <button onclick="setMode('ai')" class="w-full p-4 rounded-2xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/50 flex items-center gap-4 transition text-left group">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <div class="font-bold text-sm text-slate-200">單人人機對戰</div>
            <div class="text-xs text-slate-400">挑戰智慧人機對手 (AI)</div>
          </div>
        </button>

        <button onclick="openOnlineMenu()" class="w-full p-4 rounded-2xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/50 flex items-center gap-4 transition text-left group">
          <div class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-500/30 text-sky-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
            <i class="fa-solid fa-globe"></i>
          </div>
          <div>
            <div class="font-bold text-sm text-slate-200">🌐 線上房間對戰</div>
            <div class="text-xs text-slate-400">建立房間或輸入房號遠端連線</div>
          </div>
        </button>
      </div>

      <button onclick="closeModeMenu()" class="w-full py-3 rounded-2xl bg-slate-700/30 hover:bg-slate-700/50 text-slate-400 font-semibold text-xs transition">
        取消
      </button>
    </div>
  </div>

  <!-- Modal 2: Online Lobby (Create / Join) -->
  <div id="online-modal" class="fixed inset-0 modal-backdrop hidden flex items-center justify-center p-4 z-40">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5">
      <div class="text-center">
        <h3 class="text-xl font-bold font-outfit text-slate-100">🌐 線上連線對戰</h3>
        <p class="text-xs text-slate-400 mt-1">創建房間邀請好友或輸入 6 位房號加入</p>
      </div>

      <div class="space-y-4">
        <!-- Create Room Option -->
        <button onclick="createOnlineRoom()" class="w-full py-3.5 px-4 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm shadow-lg shadow-sky-600/30 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus-circle"></i> 建立新房間
        </button>

        <div class="flex items-center gap-3">
          <div class="flex-1 h-px bg-slate-700"></div>
          <span class="text-[10px] text-slate-500 font-bold uppercase">或加入房間</span>
          <div class="flex-1 h-px bg-slate-700"></div>
        </div>

        <!-- Join Room Option -->
        <div class="space-y-2">
          <input id="join-room-input" type="text" maxlength="6" placeholder="輸入 6 位數字房號" class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl px-4 py-3 text-center text-lg font-mono tracking-widest text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-sky-500 uppercase">
          <button onclick="joinOnlineRoom()" class="w-full py-3 px-4 rounded-2xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-sm border border-slate-600 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> 輸入房號加入
          </button>
        </div>
      </div>

      <button onclick="closeOnlineMenu()" class="w-full py-3 rounded-2xl bg-slate-700/30 hover:bg-slate-700/50 text-slate-400 font-semibold text-xs transition">
        返回
      </button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // =========================================================================
    // 0. AUTO-SCALE (ACCURATE NO SCROLL) LOGIC
    // =========================================================================
    function autoScale() {
      const container = document.getElementById('game-container');
      if (!container) return;

      const targetWidth = 380;  // 基準設計寬度
      const targetHeight = 620; // 完整高度基準 (包含底部按鈕)

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const scaleX = windowWidth / targetWidth;
      const scaleY = windowHeight / targetHeight;
      const scale = Math.min(scaleX, scaleY) * 0.92; // 0.92 確保四周留足安全微邊距

      container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', autoScale);
    window.addEventListener('load', autoScale);

    // =========================================================================
    // 1. FIREBASE CONFIGURATION
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDPSKUIlpu-DXATWSe__zUixRQh41BTJM0",
      authDomain: "tictactoe-online-65492.firebaseapp.com",
      databaseURL: "https://tictactoe-online-65492-default-rtdb.firebaseio.com",
      projectId: "tictactoe-online-65492",
      storageBucket: "tictactoe-online-65492.firebasestorage.app",
      messagingSenderId: "63333498074",
      appId: "1:63333498074:web:96df3c361d589ec422b9e3"
    };

    let database = null;
    let isFirebaseReady = false;

    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        isFirebaseReady = true;
      }
    } catch (e) {
      console.warn("Firebase 未能成功初始化，請檢查 firebaseConfig 設定。", e);
    }

    // =========================================================================
    // 2. GAME STATE VARIABLES
    // =========================================================================
    let gameMode = 'pass-and-play';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;
    
    let currentRoomId = null;
    let mySymbol = null;
    let roomRef = null;

    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    // =========================================================================
    // 3. INITIALIZATION & URL PARSING
    // =========================================================================
    window.onload = function() {
      autoScale();
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');

      if (roomParam && roomParam.length === 6) {
        if (!isFirebaseReady) {
          showToast("⚠️ 請先在程式碼中填入你的 Firebase 設定參數才能使用連線！");
        } else {
          document.getElementById('join-room-input').value = roomParam;
          joinOnlineRoom(roomParam);
        }
      } else {
        renderBoard();
      }
    };

    // =========================================================================
    // 4. CORE GAME BOARD LOGIC
    // =========================================================================
    function handleCellClick(index) {
      if (!isGameActive || board[index] !== "") return;

      if (gameMode === 'online') {
        if (!currentRoomId || currentPlayer !== mySymbol) {
          showToast("還沒輪到你落子！");
          return;
        }
        makeOnlineMove(index);
        return;
      }

      executeMove(index, currentPlayer);

      if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
        setTimeout(makeAIMove, 400);
      }
    }

    function executeMove(index, player) {
      board[index] = player;
      renderBoard();

      const winner = checkWinner();
      if (winner) {
        isGameActive = false;
        if (winner === 'draw') {
          updateStatus("平局！和棋 🤝", "這局雙方勢均力敵");
        } else {
          updateStatus(`玩家 ${winner} 獲得勝利！ 🎉`, "恭喜贏得本局！");
          highlightWinningCombo(getWinningCombo());
        }
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus(`輪到 ${currentPlayer} 下棋`, gameMode === 'ai' && currentPlayer === 'O' ? 'AI 正在思考中...' : '請點擊棋盤落子');
    }

    function makeAIMove() {
      if (!isGameActive) return;

      let bestMove = findBestMove('O') ?? findBestMove('X') ?? (board[4] === "" ? 4 : null);

      if (bestMove === null) {
        const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        if (available.length > 0) {
          bestMove = available[Math.floor(Math.random() * available.length)];
        }
      }

      if (bestMove !== null) {
        executeMove(bestMove, 'O');
      }
    }

    function findBestMove(player) {
      for (let combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        const values = [board[a], board[b], board[c]];
        if (values.filter(v => v === player).length === 2 && values.filter(v => v === "").length === 1) {
          return combo[values.indexOf("")];
        }
      }
      return null;
    }

    function checkWinner() {
      for (let combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return board.includes("") ? null : 'draw';
    }

    function getWinningCombo() {
      for (let combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return combo;
        }
      }
      return null;
    }

    // =========================================================================
    // 5. RENDER & UI UPDATES
    // =========================================================================
    function renderBoard() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        const val = board[idx];
        cell.innerHTML = val === 'X' 
          ? `<span class="glow-x">X</span>` 
          : val === 'O' 
          ? `<span class="glow-o">O</span>` 
          : '';
      });
    }

    function highlightWinningCombo(combo) {
      if (!combo) return;
      const cells = document.querySelectorAll('.cell');
      combo.forEach(idx => {
        cells[idx].classList.add('bg-slate-700', 'ring-2', 'ring-amber-400');
      });
    }

    function clearHighlights() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach(cell => {
        cell.classList.remove('bg-slate-700', 'ring-2', 'ring-amber-400');
      });
    }

    function updateStatus(msg, subMsg) {
      document.getElementById('status-message').innerText = msg;
      document.getElementById('role-subtitle').innerText = subMsg || "";
      
      const turnIndicator = document.getElementById('turn-indicator');
      turnIndicator.innerHTML = currentPlayer === 'X' 
        ? `<span class="glow-x">X</span>` 
        : `<span class="glow-o">O</span>`;
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      isGameActive = true;
      currentPlayer = "X";
      clearHighlights();
      renderBoard();

      if (gameMode === 'online' && currentRoomId) {
        roomRef.update({
          board: board,
          turn: "X",
          winner: null
        });
        showToast("已發起重新開始格局");
        return;
      }

      updateStatus(`輪到 ${currentPlayer} 下棋`, "雙人輪流落子");
    }

    // =========================================================================
    // 6. ONLINE MULTIPLAYER (FIREBASE)
    // =========================================================================
    function createOnlineRoom() {
      if (!isFirebaseReady) {
        showToast("⚠️ 請先在 index.html 中填入你的 Firebase 設定！");
        return;
      }

      const roomId = Math.floor(100000 + Math.random() * 900000).toString();
      currentRoomId = roomId;
      mySymbol = 'X';
      gameMode = 'online';

      roomRef = database.ref('tictactoe_rooms/' + roomId);
      
      roomRef.set({
        board: ["", "", "", "", "", "", "", "", ""],
        turn: "X",
        playerX: "connected",
        playerO: "waiting",
        winner: null
      });

      roomRef.onDisconnect().remove();

      closeOnlineMenu();
      closeModeMenu();
      setupOnlineUI();
      listenToRoom();

      showToast(`房間已建立！房號：${roomId}`);
    }

    function joinOnlineRoom(inputRoomId) {
      if (!isFirebaseReady) {
        showToast("⚠️ 請先在 index.html 中填入你的 Firebase 設定！");
        return;
      }

      const roomId = inputRoomId || document.getElementById('join-room-input').value.trim();
      if (roomId.length !== 6) {
        showToast("請輸入正確的 6 位數房號");
        return;
      }

      const targetRef = database.ref('tictactoe_rooms/' + roomId);

      targetRef.once('value', (snapshot) => {
        if (!snapshot.exists()) {
          showToast("找不到此房間，請確認房號是否正確！");
          return;
        }

        const data = snapshot.val();
        if (data.playerO === "connected") {
          showToast("該房間人數已滿！");
          return;
        }

        currentRoomId = roomId;
        mySymbol = 'O';
        gameMode = 'online';
        roomRef = targetRef;

        roomRef.update({ playerO: "connected" });

        closeOnlineMenu();
        closeModeMenu();
        setupOnlineUI();
        listenToRoom();

        showToast(`成功加入房間：${roomId}`);
      });
    }

    function listenToRoom() {
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          showToast("房間已被關閉或對手已離線");
          leaveOnlineRoom();
          return;
        }

        board = data.board;
        currentPlayer = data.turn;
        renderBoard();

        if (data.playerO === "waiting") {
          updateStatus("等待對手加入...", `你的房號是: ${currentRoomId}`);
          isGameActive = false;
        } else {
          isGameActive = !data.winner;

          if (data.winner) {
            if (data.winner === 'draw') {
              updateStatus("平局！和棋 🤝", "對局結束");
            } else {
              updateStatus(`玩家 ${data.winner} 獲勝！ 🎉`, data.winner === mySymbol ? "你贏了！" : "對方獲勝");
              highlightWinningCombo(checkWinnerComboForBoard(data.board));
            }
          } else {
            const isMyTurn = currentPlayer === mySymbol;
            updateStatus(
              isMyTurn ? "輪到你落子！" : `等待對方 (${currentPlayer}) 落子...`,
              `你是 ${mySymbol} 棋`
            );
          }
        }
      });
    }

    function makeOnlineMove(index) {
      const newBoard = [...board];
      newBoard[index] = mySymbol;

      const nextTurn = mySymbol === 'X' ? 'O' : 'X';
      const winner = checkWinnerForBoard(newBoard);

      roomRef.update({
        board: newBoard,
        turn: nextTurn,
        winner: winner || null
      });
    }

    function leaveOnlineRoom() {
      if (roomRef) {
        roomRef.off();
        roomRef.remove();
      }
      currentRoomId = null;
      mySymbol = null;
      roomRef = null;
      
      setMode('pass-and-play');
      showToast("已離開線上房間");
    }

    function checkWinnerForBoard(b) {
      for (let combo of WINNING_COMBOS) {
        const [a, bIdx, c] = combo;
        if (b[a] && b[a] === b[bIdx] && b[a] === b[c]) return b[a];
      }
      return b.includes("") ? null : 'draw';
    }

    function checkWinnerComboForBoard(b) {
      for (let combo of WINNING_COMBOS) {
        const [a, bIdx, c] = combo;
        if (b[a] && b[a] === b[bIdx] && b[a] === b[c]) return combo;
      }
      return null;
    }

    // =========================================================================
    // 7. UI MODALS & UTILITIES
    // =========================================================================
    function setMode(mode) {
      gameMode = mode;
      
      const modeText = document.getElementById('mode-text');
      if (mode === 'pass-and-play') modeText.innerText = "同屏雙人";
      if (mode === 'ai') modeText.innerText = "單人 vs AI";
      if (mode === 'online') modeText.innerText = "🌐 線上房間";

      document.getElementById('room-info').classList.add('hidden');
      document.getElementById('leave-room-btn').classList.add('hidden');

      closeModeMenu();
      resetGame();
    }

    function setupOnlineUI() {
      document.getElementById('mode-text').innerText = "🌐 線上房間";
      document.getElementById('display-room-id').innerText = currentRoomId;
      document.getElementById('room-info').classList.remove('hidden');
      document.getElementById('leave-room-btn').classList.remove('hidden');
    }

    function openModeMenu() {
      document.getElementById('mode-modal').classList.remove('hidden');
    }
    function closeModeMenu() {
      document.getElementById('mode-modal').classList.add('hidden');
    }
    function openOnlineMenu() {
      document.getElementById('online-modal').classList.remove('hidden');
    }
    function closeOnlineMenu() {
      document.getElementById('online-modal').classList.add('hidden');
    }

    function copyInviteLink() {
      if (!currentRoomId) return;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
      
      const tempInput = document.createElement("input");
      tempInput.value = inviteUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);

      showToast("已複製專屬邀請連結！");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 3000);
    }
  </script>
</body>
</html>
